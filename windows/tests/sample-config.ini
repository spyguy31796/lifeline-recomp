# Sample launcher config (no game data). Used by the run.ps1 tests.
[launch]
skip_tutorial = 0
fullscreen = 1
debug = 1
voice_off = 0

[qol]
voice_readout = 0
voice_tuning = 0
resolution_scale = 2
save_slots = 1
always_on = 0
large_model = 0
widescreen = 1
faster_loads = 0
vu_fast = 1
button_icons = xbox
fast_forward = 1
fmv_skip = 0

[bindings]
circle = b, paddle1        # push-to-talk
hk_quit = key:Ctrl&key:Q@500, key:Escape@1000, back&start@1500
hk_ff = key:Tab, back&righttrigger
